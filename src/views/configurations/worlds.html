<section id="page-worlds" class="page-section" hidden>
            <div class="panel">
                <div class="panel-heading">
                    <div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h2 data-i18n="worlds.title">Gestión de Mundos</h2>
                            <div id="worlds-server-badge" class="mc-server-identity-badge"></div>
                        </div>
                        <p class="hint" data-i18n="worlds.hint">Administra los mundos del servidor. Nota: el cambio de mundo activo requiere que reinicies el servidor.</p>
                    </div>
                    <div class="row responsive-row">
                        <button id="btn-worlds-open-folder" type="button" class="mc-btn-secondary btn-small" data-i18n="worlds.btn_open_folder">Abrir carpeta</button>
                        <button id="btn-import-world" type="button" class="mc-btn-secondary btn-small" data-i18n="worlds.btn_import">Importar (.zip)</button>
                        <button id="btn-create-world" type="button" class="mc-btn-primary btn-small" data-i18n="worlds.btn_create">Crear mundo</button>
                        <button id="btn-worlds-back" type="button" class="mc-btn-secondary btn-small" data-i18n="common.back">Volver</button>
                    </div>
                </div>

                <div id="list-worlds" style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
                    <p class="hint" style="text-align: center; margin: 16px 0;" data-i18n="worlds.loading">Cargando mundos...</p>
                </div>
            </div>
        </section>
