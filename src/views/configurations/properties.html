<section id="page-properties" class="page-section" hidden>
            <div class="panel">
                <div class="panel-heading">
                    <div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h2 data-i18n="properties.title">Propiedades del servidor</h2>
                            <div class="mc-server-identity-badge" style="display: none;"></div>
                        </div>
                        <p class="hint" data-i18n="properties.hint">Gestiona la configuración del mundo, reglas y opciones avanzadas
                            (server.properties).</p>
                    </div>
                    <div class="row responsive-row">
                        <button id="btn-properties-save" type="button" class="mc-btn-primary" data-i18n="common.save">Guardar</button>
                        <button id="btn-properties-back" type="button" class="mc-btn-secondary btn-small" data-i18n="common.back">Volver</button>
                    </div>
                </div>

                <div class="create-tabs">
                    <button type="button" id="btn-tab-prop-game" class="create-tab-btn active" data-i18n="properties.tab_game">PARTIDA</button>
                    <button type="button" id="btn-tab-prop-server" class="create-tab-btn" data-i18n="properties.tab_server">SERVIDOR</button>
                </div>

                <div id="tab-prop-game-content">
                    <div id="prop-container-game" class="properties-grid"></div>
                </div>
                <div id="tab-prop-server-content" hidden>
                    <div id="prop-container-server" class="properties-grid"></div>
                </div>
            </div>
        </section>
