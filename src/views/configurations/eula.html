<section id="page-eula" class="page-section" hidden>
            <div class="panel">
                <div class="panel-heading">
                    <div>
                        <h2>EULA de Minecraft</h2>
                        <p class="hint">
                            Debes leer y aceptar el Acuerdo de Licencia de Usuario Final (EULA) de Minecraft para poder ejecutar el servidor.
                        </p>
                    </div>
                </div>

                <div id="eula-text-container" style="max-height: 380px; overflow-y: auto; padding: 20px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);">Cargando el texto del EULA...</div>

                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
                    <input type="checkbox" id="checkbox-accept-eula" style="cursor: pointer;" />
                    <label for="checkbox-accept-eula" style="font-weight: normal; cursor: pointer; user-select: none;">Acepto los términos y condiciones del EULA de Minecraft.</label>
                </div>

                <div class="row action-row">
                    <button id="btn-eula-accept-continue" type="button" class="mc-btn-primary" disabled>
                        Aceptar EULA
                    </button>
                    <button id="btn-eula-cancel" type="button" class="mc-btn-secondary">
                        Cancelar
                    </button>
                </div>
            </div>
        </section>
