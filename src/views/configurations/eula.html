<section id="page-eula" class="page-section" hidden>
            <div class="panel" style="max-width: 840px; margin: 0 auto;">
                <div class="panel-heading">
                    <div>
                        <h2 data-i18n="eula.title">Acuerdo de Licencia (EULA) de Minecraft</h2>
                        <p class="hint" data-i18n="eula.hint">
                            Para iniciar el servidor, debes leer completamente y aceptar los términos del EULA oficial de Mojang / Microsoft.
                        </p>
                    </div>
                </div>

                <div id="eula-text-container" class="eula-document-box" style="height: 380px; max-height: 380px; overflow-y: auto; padding: 20px; background: rgba(0, 0, 0, 0.4); border: 2px solid var(--border-color, #333333); border-radius: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; white-space: pre-wrap; font-size: 0.92rem; margin-bottom: 14px; line-height: 1.65; color: #e0e0e0; box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);" data-i18n="eula.loading">Cargando el texto del EULA...</div>

                <div id="eula-scroll-hint" style="font-size: 0.85rem; color: #fbbf24; margin-bottom: 14px;">
                    <span data-i18n="eula.scroll_hint">Desplázate hasta el final del texto para habilitar la opción de aceptación.</span>
                </div>

                <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
                    <label class="switch-label" style="margin: 0; width: auto; flex-shrink: 0;">
                        <input type="checkbox" id="checkbox-accept-eula" disabled />
                    </label>
                    <label id="label-accept-eula" for="checkbox-accept-eula" style="font-weight: normal; cursor: not-allowed; user-select: none; color: #888; margin: 0;" data-i18n="eula.accept_label">
                        He leído y acepto los términos y condiciones del EULA de Minecraft.
                    </label>
                </div>

                <div class="row action-row">
                    <button id="btn-eula-accept-continue" type="button" class="mc-btn-primary" disabled data-i18n="eula.btn_accept">
                        Aceptar EULA y Continuar
                    </button>
                    <button id="btn-eula-cancel" type="button" class="mc-btn-secondary" data-i18n="common.cancel">
                        Cancelar
                    </button>
                </div>
            </div>
        </section>
