<section id="page-customization" class="page-section" hidden>
    <div class="panel" style="width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--mc-border); padding-bottom: 12px;">
            <div>
                <h2 style="margin: 0; color: var(--mc-yellow); font-size: 1.6rem;">Personalización de Interfaz</h2>
                <p class="hint" style="margin: 4px 0 0 0;">Elige la paleta de colores que prefieras para tu panel de control.</p>
            </div>
            <button id="btn-customization-back" type="button" class="mc-btn-secondary" style="padding: 8px 16px;">
                VOLVER AL INICIO
            </button>
        </div>

        <div id="theme-cards-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 8px;">
            <!-- Tarjetas de temas cargadas dinámicamente -->
        </div>

        <!-- Sección de Ajustes de Sonido -->
        <div class="minecraft-table" style="padding: 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 16px; border-top: 4px solid var(--mc-border);">
            <h3 style="margin: 0; color: var(--mc-yellow); font-size: 1.2rem; border-bottom: 2px solid var(--mc-border); padding-bottom: 8px;">Ajustes de Sonido</h3>
            
            <!-- Volumen Clics -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: var(--mc-white); font-size: 1rem;">Volumen de Botones y Menús:</span>
                    <span id="label-sfx-volume" style="font-family: var(--font-title); color: var(--mc-yellow); font-size: 1.1rem;">75%</span>
                </div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <input id="input-sfx-volume" type="range" min="0" max="100" value="75" style="flex: 1; cursor: pointer; accent-color: var(--mc-green);" />
                    <button id="btn-test-sfx" type="button" class="mc-btn-secondary btn-small" style="margin: 0; padding: 6px 16px;">
                        Probar Clic
                    </button>
                </div>
            </div>

            <!-- Volumen Tecleado -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: var(--mc-white); font-size: 1rem;">Volumen de Tecleado (Escritura):</span>
                    <span id="label-typing-volume" style="font-family: var(--font-title); color: var(--mc-yellow); font-size: 1.1rem;">75%</span>
                </div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <input id="input-typing-volume" type="range" min="0" max="100" value="75" style="flex: 1; cursor: pointer; accent-color: var(--mc-green);" />
                    <input id="input-test-typing" type="text" placeholder="Escribe aquí para probar..." style="width: 220px; padding: 6px 12px; font-size: 0.9rem;" />
                </div>
            </div>
        </div>
    </div>
</section>
