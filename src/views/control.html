<section id="page-control" class="page-section" hidden>
            <div class="console-wrapper">
                <div class="panel" style="flex: 1; min-height: 0;">
                    <div class="panel-heading">
                        <div>
                            <h2 data-i18n="control.terminal_title">Terminal del servidor</h2>
                            <p class="hint" data-i18n="control.terminal_hint">
                                La terminal solo se muestra en esta página.
                            </p>
                        </div>
                    </div>

                    <div class="row responsive-row">
                        <input id="input-command" type="text" placeholder="Escribe un comando para la consola del servidor"
                            data-i18n-ph="control.command_ph"
                            autocomplete="off" />
                        <button id="btn-send-command" type="button" class="mc-btn-primary" data-i18n="control.btn_send_command">
                            Enviar comando
                        </button>
                    </div>

                    <div id="log-output" class="log-output top-space" aria-live="polite"></div>
                </div>
            </div>

            <div class="actions-wrapper">
                <div class="panel">
                    <div class="panel-heading">
                        <div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <h2 data-i18n="control.panel_title">Control de servidor</h2>
                                <div class="mc-server-identity-badge" style="display: none;"></div>
                            </div>
                            <p class="hint" data-i18n="control.panel_hint">
                                Gestiona el servidor, revisa la terminal y envía comandos desde aquí.
                            </p>
                        </div>
                    </div>

                    <div class="summary-grid">
                        <div>
                            <span class="summary-label" data-i18n="control.summary_server">Servidor</span>
                            <strong id="summary-server-name">—</strong>
                        </div>
                        <div>
                            <span class="summary-label" data-i18n="control.summary_folder">Carpeta</span>
                            <strong id="summary-server-dir">—</strong>
                        </div>
                        <div>
                            <span class="summary-label" data-i18n="control.summary_software">Software</span>
                            <strong id="summary-jar-file">—</strong>
                        </div>
                        <div>
                            <span class="summary-label" data-i18n="control.summary_java">Java</span>
                            <strong id="summary-java-path">—</strong>
                        </div>
                        <div>
                            <span class="summary-label" data-i18n="control.summary_ram">RAM</span>
                            <strong id="summary-memory">—</strong>
                        </div>
                    </div>

                    <div style="margin-top: auto; padding-top: 12px;">
                        <!-- Grupo 1: Acciones del servidor (Cuadrícula 2x2) -->
                        <div class="tools-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <button id="btn-control-start" type="button" class="mc-btn-primary" style="width: 100%;" data-i18n="control.btn_start">
                                Iniciar
                            </button>
                            <button id="btn-control-stop" type="button" class="mc-btn-danger" style="width: 100%;" data-i18n="control.btn_stop">
                                Detener
                            </button>
                            <button id="btn-control-open-folder" type="button" class="mc-btn-secondary btn-small" style="width: 100%;" data-i18n="common.open">
                                Abrir
                            </button>
                            <button id="btn-control-delete-server" type="button" class="mc-btn-secondary btn-small" style="width: 100%;" data-i18n="common.delete">
                                Borrar
                            </button>
                            <button id="btn-control-eula" type="button" class="mc-btn-warning" hidden style="grid-column: span 2; width: 100%;" data-i18n="control.btn_accept_eula">
                                Aceptar EULA
                            </button>
                        </div>

                        <!-- Grupo 2: Navegación y Gestión (Cuadrícula con Volver 1x2) -->
                        <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                <button id="btn-toggle-config-panel" type="button" class="mc-btn-secondary btn-small" style="width: 100%;" data-i18n="control.btn_config">
                                    Configuración
                                </button>
                                <button id="btn-open-properties" type="button" class="mc-btn-secondary btn-small" style="width: 100%;" data-i18n="control.btn_properties">
                                    Propiedades
                                </button>
                                <button id="btn-control-back" type="button" class="mc-btn-secondary btn-small" style="grid-column: span 2; width: 100%;" data-i18n="common.back">
                                    Volver
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-heading">
                        <div>
                            <h2 data-i18n="control.performance_title">Rendimiento</h2>
                        </div>
                    </div>
                    <div class="row responsive-row" style="gap: 12px; margin-top: 4px;">
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem;">
                                <span style="color: var(--text-secondary);" data-i18n="control.stat_cpu">CPU</span>
                                <strong id="chart-cpu-val" style="color: #00d2ff;">--%</strong>
                            </div>
                            <canvas id="chart-cpu" style="width: 100%; height: 80px; border-radius: 4px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05);"></canvas>
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem;">
                                <span style="color: var(--text-secondary);" data-i18n="control.stat_ram">RAM</span>
                                <strong id="chart-ram-val" style="color: #d15eff;">-- MB</strong>
                            </div>
                            <canvas id="chart-ram" style="width: 100%; height: 80px; border-radius: 4px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05);"></canvas>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-heading" style="margin-bottom: 12px;">
                        <div>
                            <h2 data-i18n="control.quick_tools_title">Herramientas Rápidas</h2>
                        </div>
                    </div>
                    <div class="tools-grid">
                        <button id="btn-open-players" type="button" class="mc-btn-secondary btn-small">
                            <span data-i18n="control.tool_players">Jugadores</span> (<span id="players-count">0</span>)
                        </button>
                        <button id="btn-open-worlds" type="button" class="mc-btn-secondary btn-small" data-i18n="control.tool_worlds">
                            Mundos
                        </button>
                        <button id="btn-open-extensions" type="button" class="mc-btn-secondary btn-small" data-i18n="control.tool_extensions">
                            Complementos
                        </button>
                        <button id="btn-open-backups" type="button" class="mc-btn-secondary btn-small" data-i18n="control.tool_backups">
                            Tareas/Backups
                        </button>
                    </div>
                    <!-- #players-list removido, movido a la página de jugadores -->
                </div>
            </div>
        </section>
