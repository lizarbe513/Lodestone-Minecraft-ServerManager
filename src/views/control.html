<section id="page-control" class="page-section" hidden>
            <div class="console-wrapper">
                <div class="panel" style="flex: 1; min-height: 0;">
                    <div class="panel-heading">
                        <div>
                            <h2>Terminal del servidor</h2>
                            <p class="hint">
                                La terminal solo se muestra en esta página.
                            </p>
                        </div>
                    </div>

                    <div class="row responsive-row">
                        <input id="input-command" type="text" placeholder="Escribe un comando para la consola del servidor"
                            autocomplete="off" />
                        <button id="btn-send-command" type="button" class="mc-btn-primary">
                            Enviar comando
                        </button>
                    </div>

                    <div id="log-output" class="log-output top-space" aria-live="polite"></div>
                </div>
            </div>

            <div class="actions-wrapper">
                <div class="panel">
                    <div class="panel-heading">
                        <div>
                            <h2>Control de servidor</h2>
                            <p class="hint">
                                Gestiona el servidor, revisa la terminal y envía comandos desde aquí.
                            </p>
                        </div>
                        <div class="row responsive-row">
                            <button id="btn-toggle-config-panel" type="button" class="mc-btn-secondary btn-small">
                                Configuración
                            </button>
                            <button id="btn-open-properties" type="button" class="mc-btn-secondary btn-small">
                                Propiedades
                            </button>
                            <button id="btn-control-back" type="button" class="mc-btn-secondary btn-small">
                                Volver
                            </button>
                        </div>
                    </div>

                    <div class="summary-grid">
                        <div>
                            <span class="summary-label">Servidor</span>
                            <strong id="summary-server-name">—</strong>
                        </div>
                        <div>
                            <span class="summary-label">Carpeta</span>
                            <strong id="summary-server-dir">—</strong>
                        </div>
                        <div>
                            <span class="summary-label">Software</span>
                            <strong id="summary-jar-file">—</strong>
                        </div>
                        <div>
                            <span class="summary-label">Java</span>
                            <strong id="summary-java-path">—</strong>
                        </div>
                        <div>
                            <span class="summary-label">RAM</span>
                            <strong id="summary-memory">—</strong>
                        </div>
                    </div>

                    <div class="row action-row">
                        <button id="btn-control-start" type="button" class="mc-btn-primary">
                            Iniciar
                        </button>
                        <button id="btn-control-stop" type="button" class="mc-btn-danger">
                            Detener
                        </button>
                        <button id="btn-control-open-folder" type="button" class="mc-btn-secondary btn-small">
                            Abrir
                        </button>
                        <button id="btn-control-delete-server" type="button" class="mc-btn-secondary btn-small">
                            Borrar
                        </button>
                        <button id="btn-control-eula" type="button" class="mc-btn-warning" hidden>
                            EULA
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-heading">
                        <div>
                            <h2>Rendimiento</h2>
                        </div>
                    </div>
                    <div class="row responsive-row" style="gap: 12px; margin-top: 4px;">
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem;">
                                <span style="color: var(--text-secondary);">CPU</span>
                                <strong id="chart-cpu-val" style="color: #00d2ff;">--%</strong>
                            </div>
                            <canvas id="chart-cpu" style="width: 100%; height: 80px; border-radius: 4px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05);"></canvas>
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem;">
                                <span style="color: var(--text-secondary);">RAM</span>
                                <strong id="chart-ram-val" style="color: #d15eff;">-- MB</strong>
                            </div>
                            <canvas id="chart-ram" style="width: 100%; height: 80px; border-radius: 4px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05);"></canvas>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-heading" style="margin-bottom: 12px;">
                        <div>
                            <h2>Herramientas Rápidas</h2>
                        </div>
                    </div>
                    <div class="tools-grid">
                        <button id="btn-open-players" type="button" class="mc-btn-secondary btn-small">
                            Jugadores (<span id="players-count">0</span>)
                        </button>
                        <button id="btn-open-worlds" type="button" class="mc-btn-secondary btn-small">
                            Mundos
                        </button>
                        <button id="btn-open-extensions" type="button" class="mc-btn-secondary btn-small">
                            Mods/Plugins
                        </button>
                        <button id="btn-open-backups" type="button" class="mc-btn-secondary btn-small">
                            Tareas/Backups
                        </button>
                    </div>
                    <!-- #players-list removido, movido a la página de jugadores -->
                </div>
            </div>
        </section>
